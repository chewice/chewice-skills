schema_version: "2.0"
skill: "scripting-style"
source_root: "<SOURCE_ROOT>"
path_policy: "all paths are relative to source_root; source files remain read-only"
selection_order: ["target_file_type", "task_similarity"]
selection_limit: "one same-type primary and, only when useful, one same-type complement"
cross_type_style_transfer: false

file_types:
  r:
    extensions: [".R"]
    primary:
      - path: "02-annotation/scripts/01-HS_BM_manual_annotation.R"
        tasks: ["quality-checks", "parameter-comparison", "human-annotation", "human-edited-handoff"]
        represents: ["observational-checkpoints", "evidence-before-choice", "part-boundary"]
        do_not_generalize: ["cutoffs", "markers", "labels", "tissue-conclusions"]
      - path: "03-integration/scripts/02-inter-rpca.R"
        tasks: ["integration", "method-specific-branch"]
        represents: ["visible-method-rationale", "comparable-diagnostics", "shared-baseline"]
        do_not_generalize: ["method-default", "parameter-values", "plot-settings"]
      - path: "04-grn/scripts/03-unsupervised_partI.R"
        tasks: ["exploratory-analysis", "candidate-comparison", "result-interpretation"]
        represents: ["question-driven-blocks", "multiple-candidate-evidence", "choice-written-back"]
        do_not_generalize: ["algorithms", "clusters", "regulons", "conclusions"]
      - path: "07-trajectory/scripts/05-1-dynamic-genes-Mega.R"
        tasks: ["representative-trial", "per-element-model", "batch-scan"]
        represents: ["inline-prototype-before-helper", "diagnostic-control", "stable-batch-kernel"]
        do_not_generalize: ["lineage", "model-family", "genes", "cutoffs"]
      - path: "07-trajectory/scripts/07-1-dynamic-module-Ery.R"
        tasks: ["expensive-analysis", "module-analysis", "replotting"]
        represents: ["scientific-cache", "long-semantic-blocks", "interpretation-after-batch"]
        do_not_generalize: ["cache-schema", "modules", "environment-paths", "parameters"]
    complement:
      - path: "01-scrna-qc/scripts/03-calculate_metrics.R"
        tasks: ["qc", "metadata-metrics"]
        represents: ["incremental-object-update", "head-and-summary-checks"]
        do_not_generalize: ["package-installation", "qc-thresholds", "object-schema"]
      - path: "03-integration/scripts/04-save-data.R"
        tasks: ["narrow-export", "part-handoff"]
        represents: ["single-purpose-bridge", "explicit-downstream-format"]
        do_not_generalize: ["format-choice", "paths"]
      - path: "07-trajectory/scripts/02-lineage-picker.R"
        tasks: ["interactive-candidate-inspection", "human-selection"]
        represents: ["diagnostic-artifact-before-manual-choice"]
        do_not_generalize: ["lineages", "cell-identifiers", "visualization-library"]
      - path: "07-trajectory/scripts/03-lineage-mst.R"
        tasks: ["resume-after-human-choice", "trajectory"]
        represents: ["selected-values-written-as-visible-constants", "opaque-api-call"]
        do_not_generalize: ["root", "terminal", "lineage", "cell-identifiers"]
    validation_holdout:
      - path: "02-annotation/scripts/03-HS_BM_auto_annotation-part2.R"
        tests: ["part-continuation", "human-confirmation"]
      - path: "03-integration/scripts/03-inter-harmony.R"
        tests: ["method-neutral-guidance", "parallel-method-script"]
      - path: "04-grn/scripts/04-hypothesis_driven_partIV.R"
        tests: ["unseen-question-driven-continuation"]
      - path: "05-from-pathway-to-program/scripts/04-metabolisum_activity.R"
        tests: ["purposeful-single-output", "activity-analysis"]
      - path: "06-lr-pairs/scripts/05-cellchat-stage-compare-weight.R"
        tests: ["large-parallel-comparison-blocks"]
      - path: "07-trajectory/scripts/05-2-dynamic-genes-Ery.R"
        tests: ["prototype-to-batch-regression", "copied-branch-drift"]
      - path: "07-trajectory/scripts/07-2-dynamic-module-Mega.R"
        tests: ["cache-boundary", "copied-branch-drift"]
    counterexample:
      - path: "04-grn/scripts/02-regulon_activity_score.R"
        reason: "reusable API and CLI implementation, not the default project analysis shape"
      - path: "06-lr-pairs/scripts/06-cellchat-lr-focus.R"
        reason: "function-heavy boundary with fallback behavior; useful for judging when reuse has become a tool"

  python:
    extensions: [".py"]
    evidence_limit: "one narrow project converter; do not infer notebook or general application structure from it"
    primary:
      - path: "04-grn/scripts/02-regulon2gmt.py"
        tasks: ["project-format-conversion", "external-tool-bridge"]
        represents: ["direct-top-level-transformation", "actual-positional-contract", "narrow-parser-helper"]
        do_not_generalize: ["sys-argv-as-default", "formats", "minimum-size", "URLs", "library-choice"]
    validation_holdout: []
    counterexample: []

  bash:
    extensions: [".sh"]
    primary:
      - path: "01-scrna-qc/scripts/01-cellranger.sh"
        tasks: ["external-quantification", "few-known-samples"]
        represents: ["direct-tool-command", "explicit-repeated-sample-blocks"]
        do_not_generalize: ["samples", "resources", "tool-flags", "missing-shell-safety"]
    complement:
      - path: "04-grn/scripts/02-run_pyscenic.sh"
        tasks: ["multi-step-external-analysis", "manual-expensive-stages"]
        represents: ["visible-command-order", "explicit-project-inputs", "manual-stage-selection"]
        do_not_generalize: ["commented-commands-as-default", "environment-runner", "resources", "tool-flags"]
    validation_holdout:
      - path: "01-scrna-qc/scripts/02-starsolo.sh"
        tests: ["second-tool-generalization", "explicit-sample-repetition", "safety-boundary"]
    counterexample: []

  notebook:
    extensions: [".ipynb"]
    primary:
      - path: "05-from-pathway-to-program/scripts/01-run_cNMF.ipynb"
        tasks: ["factorization", "candidate-sweep", "model-selection"]
        represents: ["candidate-values", "diagnostic-before-choice", "selection-in-later-cell"]
        do_not_generalize: ["rank", "seed", "notebook-magics", "execution-counts", "stored-outputs", "paths"]
      - path: "03-integration/scripts/05-inter-scvi.ipynb"
        tasks: ["full-model-analysis", "integration"]
        represents: ["direct-cell-sequence", "model-to-latent-to-diagnostics-to-save"]
        do_not_generalize: ["model-default", "hyperparameters", "stored-outputs", "environment-cleanup"]
    complement: []
    validation_holdout:
      - path: "03-integration/scripts/06-inter-scanvi.ipynb"
        tests: ["semi-supervised-model-branch", "same-type-generalization"]
      - path: "03-integration/scripts/07-inter-bbknn.ipynb"
        tests: ["alternative-method-branch", "same-type-generalization"]
    counterexample: []

global_exclusions:
  - "machine-specific absolute paths"
  - "historical scientific parameters or biological conclusions"
  - "package installation and environment cleanup"
  - "destructive temporary-directory handling"
  - "stale notebook execution counts and stored outputs"
  - "undocumented API internals"
