schema_version: "1.0"
skill: "scripting-style"
source_root: "<SOURCE_ROOT>"
path_policy: "all example paths are relative to source_root"
selection_rule: "select one primary and at most one complementary example from the same stage"
examples:
  "01-scrna-qc":
    - path: "01-scrna-qc/scripts/03-calculate_metrics.R"
      language: "R"
      task_type: "qc-metrics"
      role: "primary"
      represents: ["linear-analysis", "adjacent-checks", "tables-figures-objects"]
      learn_main_flow: true
      learn_plotting: true
      learn_output: true
      learn_local_helpers: false
      do_not_generalize: ["qc-cutoffs", "paths", "object-schema"]
    - path: "01-scrna-qc/scripts/02-starsolo.sh"
      language: "Bash"
      task_type: "external-quantification"
      role: "secondary"
      represents: ["visible-parameters", "direct-command-order"]
      learn_main_flow: true
      learn_plotting: false
      learn_output: true
      learn_local_helpers: false
      do_not_generalize: ["tool-flags", "resources", "samples", "environment"]
    - path: "01-scrna-qc/scripts/01-cellranger.sh"
      language: "Bash"
      task_type: "external-quantification"
      role: "validation-holdout"
      use_for_rule_learning: false

