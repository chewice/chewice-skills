schema_version: "1.0"
phase: "phase-1"
status: "phase-1-confirmed"
confirmed_at: "2026-07-30"
source_root: "<SOURCE_ROOT>"
learning_policy:
  readme_use: "context-only"
  top_level_R: "opaque-api-boundary-only"
  environment_details: "excluded"
  validation_holdouts_used_for_rule_learning: false
stages:
  - stage: "01"
    project: "01-scrna-qc"
    primary:
      - path: "01-scrna-qc/scripts/03-calculate_metrics.R"
        language: "R"
        represents: "linear QC metrics, adjacent checks and outputs"
        confidence: "high"
        do_not_generalize: "historical thresholds, paths, object schema"
    secondary:
      - path: "01-scrna-qc/scripts/02-starsolo.sh"
        language: "bash"
        represents: "direct external-tool orchestration"
        confidence: "medium"
        do_not_generalize: "tool flags, resources, sample list, environment commands"
    validation_holdouts:
      - path: "01-scrna-qc/scripts/01-cellranger.sh"
        tests: "tool-neutral Bash guidance"

  - stage: "02"
    project: "02-annotation"
    primary:
      - path: "02-annotation/scripts/01-HS_BM_manual_annotation.R"
        language: "R"
        represents: "visible checkpoints, decisions and expert knowledge"
        confidence: "high"
        do_not_generalize: "markers, labels, bone-marrow assumptions"
      - path: "02-annotation/scripts/05-HS_PBMC_auto_run.R"
        language: "R"
        represents: "complete but still linear automated annotation"
        confidence: "high"
        do_not_generalize: "PBMC reference and fixed automation route"
    secondary:
      - path: "02-annotation/scripts/02-HS_BM_auto_annotation-part1.R"
        language: "R"
        represents: "semantic sections in a long script"
        confidence: "medium-high"
      - path: "02-annotation/scripts/04-HS_BM_auto_resolution.R"
        language: "R"
        represents: "visible resolution comparison and selection"
        confidence: "high"
    validation_holdouts:
      - path: "02-annotation/scripts/03-HS_BM_auto_annotation-part2.R"
        tests: "cross-part continuity and human confirmation"

  - stage: "03"
    project: "03-integration"
    primary:
      - path: "03-integration/scripts/02-inter-rpca.R"
        language: "R"
        represents: "method rationale, nearby parameters and diagnostics"
        confidence: "high"
        do_not_generalize: "RPCA as default or historical parameter values"
    secondary:
      - path: "03-integration/scripts/01-check-batch-effect.R"
        language: "R"
        represents: "baseline before correction"
        confidence: "high"
      - path: "03-integration/scripts/04-save-data.R"
        language: "R"
        represents: "narrow export script"
        confidence: "medium"
    validation_holdouts:
      - path: "03-integration/scripts/03-inter-harmony.R"
        tests: "method-neutral integration guidance"

  - stage: "04"
    project: "04-grn"
    primary:
      - path: "04-grn/scripts/01-metacell.R"
        language: "R"
        represents: "prepare-call-check-save API boundary"
        confidence: "high"
        do_not_generalize: "metacell as mandatory GRN preprocessing"
      - path: "04-grn/scripts/03-unsupervised_partI.R"
        language: "R"
        represents: "question-driven exploratory sequence"
        confidence: "high"
      - path: "04-grn/scripts/04-hypothesis_driven_partIII.R"
        language: "R"
        represents: "biological hypothesis adjacent to analysis"
        confidence: "high"
    secondary:
      - path: "04-grn/scripts/02-run_pyscenic.sh"
        language: "bash"
        represents: "narrow external workflow orchestration"
        confidence: "medium"
        do_not_generalize: "environment and resource paths"
      - path: "04-grn/scripts/02-regulon2gmt.py"
        language: "python"
        represents: "single-purpose direct format conversion"
        confidence: "high"
      - path: "04-grn/scripts/03-unsupervised_partII.R"
        language: "R"
        represents: "continuation across analysis parts"
        confidence: "medium-high"
      - path: "04-grn/scripts/04-hypothesis_driven_partI.R"
        language: "R"
        represents: "hypothesis-driven setup"
        confidence: "medium-high"
      - path: "04-grn/scripts/05-cell_type_specific_regulon.R"
        language: "R"
        represents: "focused target-filter-output flow"
        confidence: "medium-high"
    validation_holdouts:
      - path: "04-grn/scripts/04-hypothesis_driven_partIV.R"
        tests: "generalization to an unseen hypothesis-driven continuation"
    counterexamples:
      - path: "04-grn/scripts/02-regulon_activity_score.R"
        reason: "API-like implementation; may overrepresent engineering abstractions"

  - stage: "05"
    project: "05-from-pathway-to-program"
    primary:
      - path: "05-from-pathway-to-program/scripts/02-interpret_cNMF_results_part1.R"
        language: "R"
        represents: "result-to-activity-to-interpretation sequence"
        confidence: "high"
        do_not_generalize: "program IDs, top-gene count, cutoffs"
      - path: "05-from-pathway-to-program/scripts/03-pathway_activity.R"
        language: "R"
        represents: "visible gene-set selection, scoring and comparison"
        confidence: "high"
    secondary:
      - path: "05-from-pathway-to-program/scripts/02-interpret_cNMF_results_part2.R"
        language: "R"
        represents: "continued enrichment without a generic framework"
        confidence: "medium-high"
    validation_holdouts:
      - path: "05-from-pathway-to-program/scripts/04-metabolisum_activity.R"
        tests: "generalization to another activity-scoring task"

  - stage: "06"
    project: "06-lr-pairs"
    primary:
      - path: "06-lr-pairs/scripts/03-cellchat-standard.R"
        language: "R"
        represents: "boundary between useful reuse and hidden core flow"
        confidence: "medium-high"
        do_not_generalize: "wrapping every core analysis in a function"
      - path: "06-lr-pairs/scripts/05-cellchat-stage-compare-LRnum.R"
        language: "R"
        represents: "explicit stage comparison"
        confidence: "high"
        do_not_generalize: "early/late grouping and LR-number metric"
      - path: "06-lr-pairs/scripts/07-cellchat-lr-avg-barplot.R"
        language: "R"
        represents: "direct focused ligand-receptor summary"
        confidence: "high"
    secondary:
      - path: "06-lr-pairs/scripts/01-data-summary.R"
        language: "R"
        represents: "narrow upstream summary"
        confidence: "medium"
      - path: "06-lr-pairs/scripts/02-epithelial-prepare.R"
        language: "R"
        represents: "narrow data preparation"
        confidence: "medium"
      - path: "06-lr-pairs/scripts/04-cellchat-visualize.R"
        language: "R"
        represents: "small functions for repeated plots"
        confidence: "medium"
      - path: "06-lr-pairs/scripts/06-cellchat-lr-focus.R"
        language: "R"
        represents: "focused analysis with repeated technical helpers"
        confidence: "medium"
    validation_holdouts:
      - path: "06-lr-pairs/scripts/05-cellchat-stage-compare-weight.R"
        tests: "parallel workflow with a different comparison measure"

  - stage: "07"
    project: "07-trajectory"
    primary:
      - path: "07-trajectory/scripts/01-trajectory-dr.R"
        language: "R"
        represents: "visible dimensionality-reduction decision chain"
        confidence: "high"
      - path: "07-trajectory/scripts/03-lineage-mst.R"
        language: "R"
        represents: "explicit root, terminal and lineage decisions"
        confidence: "high"
        do_not_generalize: "specific lineage endpoints"
      - path: "07-trajectory/scripts/05-1-dynamic-genes-Mega.R"
        language: "R"
        represents: "minimal per-gene helper inside a linear analysis"
        confidence: "high"
      - path: "07-trajectory/scripts/07-1-dynamic-module-Ery.R"
        language: "R"
        represents: "long analysis divided by semantic sections"
        confidence: "high"
    secondary:
      - path: "07-trajectory/scripts/02-lineage-picker.R"
        language: "R"
        represents: "show candidates before committing to a lineage"
        confidence: "high"
      - path: "07-trajectory/scripts/04-2-lineage-pcurve-Ery.R"
        language: "R"
        represents: "direct branch-specific parameterization"
        confidence: "medium-high"
      - path: "07-trajectory/scripts/06-nmf-imputation.R"
        language: "R"
        represents: "narrow helpers and cache for expensive work"
        confidence: "medium-high"
      - path: "07-trajectory/scripts/08-1-gene-module-function-Ery.R"
        language: "R"
        represents: "explicit downstream module interpretation"
        confidence: "medium-high"
      - path: "07-trajectory/scripts/09-1-gene-module-regulators-Ery.R"
        language: "R"
        represents: "explicit downstream regulator question"
        confidence: "medium-high"
    validation_holdouts:
      - path: "07-trajectory/scripts/05-2-dynamic-genes-Ery.R"
        tests: "dynamic-gene rules across another lineage branch"
      - path: "07-trajectory/scripts/07-2-dynamic-module-Mega.R"
        tests: "module rules across another lineage branch"
      - path: "07-trajectory/scripts/04-3-lineage-pcurve-Mono.R"
        tests: "principal-curve branch generalization"
