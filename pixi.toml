[workspace]
authors = ["zdh <goodalleveryday@gmail.com>"]
channels = ["conda-forge"]
name = "research-project-os-skill"
platforms = ["linux-64", "win-64"]
version = "0.3.1"

[tasks]
lint = "ruff check research-project-os/scripts tests"
test = "python -m unittest discover -s tests -p test_*.py"
smoke = "python tests/smoke_test.py"
validate-skill = "python tests/validate_skill.py"
cli-help = "python research-project-os/scripts/research_project_os.py --help"

[dependencies]
python = "3.12.*"
pyyaml = ">=6,<7"
ruff = ">=0.9,<1"
