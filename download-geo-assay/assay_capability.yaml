version: 2
assays:
  bulk_rnaseq:
    labels: [bulk_rnaseq]
    workflow: convert
    raw_types: [FASTQ, SRA]
    standard_products: [gene_count_matrix]
    optional_products: [aligned_bam]
    default_tool: STAR
    release_unit: gsm
    reference_required: true
    reference: references/assays/bulk-rnaseq.md
  scrnaseq:
    labels: [scrnaseq, snrnaseq]
    workflow: convert
    raw_types: [FASTQ, SRA]
    standard_products: [matrix_10x]
    optional_products: [matrix_velocity]
    default_tool: STARsolo
    release_unit: gsm
    reference_required: true
    reference: references/assays/scrna.md
  expression_array:
    labels: [microarray, affymetrix, illumina_expression]
    workflow: raw_or_explicit_conversion
    raw_types: [CEL, IDAT]
    standard_products: []
    optional_products: [intensity, intensity_matrix, processed]
    default_tool: null
    release_unit: gsm
    reference_required: true
    reference: references/assays/array.md
  methylation_array:
    labels: [methylation, methylation_array]
    workflow: raw_or_explicit_conversion
    raw_types: [IDAT]
    standard_products: []
    optional_products: [methylation_matrix, processed]
    default_tool: null
    release_unit: gsm
    reference_required: true
    reference: references/assays/array.md
  raw_only_sequencing:
    labels: [atac, chip, mirna, atacseq, chipseq, mirnaseq, sequencing]
    workflow: raw_only
    raw_types: [FASTQ, SRA]
    standard_products: []
    optional_products: []
    default_tool: null
    release_unit: gsm
    reference_required: false
    reference: references/assays/raw-only-seq.md
