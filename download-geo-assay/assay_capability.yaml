# Assay 能力定义：决定本 Skill 允许生成哪些数据产品。
# 不负责 DEG、pathway、可视化或生物学解释。

bulk_rnaseq:
  raw:
    - FASTQ
  conversion:
    tool: STAR GeneCounts
    alternatives:
      - STAR + featureCounts
      - Salmon
  output:
    - gene_count_matrix
  optional:
    - BAM
  velocity: false
  reference_required:
    - star_index
    - gtf

scRNAseq:
  raw:
    - FASTQ
  conversion:
    tool: STARsolo
    alternatives:
      - Cell Ranger
      - kallisto bustools
  output:
    - matrix_10x
  optional:
    - velocity_input
  velocity: optional
  reference_required:
    - star_index
    - gtf

snRNAseq:
  raw:
    - FASTQ
  conversion:
    tool: STARsolo
    alternatives:
      - Cell Ranger
      - kallisto bustools
  output:
    - matrix_10x
  optional:
    - velocity_input
  velocity: optional_with_caution
  reference_required:
    - star_index
    - gtf

microarray:
  raw:
    - CEL
  conversion: null
  output: []
  optional:
    - GEO_or_vendor_probe_mapping
  velocity: false
  notes: 本 Skill 只下载并管理 CEL；不做 normalization / RMA / 下游分析。

illumina_array:
  raw:
    - IDAT
  conversion: null
  output: []
  velocity: false
  notes: 本 Skill 只下载并管理 IDAT；不做 normalization。

methylation:
  raw:
    - IDAT
  conversion: null
  output: []
  velocity: false

atac:
  raw:
    - FASTQ
  conversion: null
  output: []
  velocity: false
  notes: 用户未指定转换产品则只获取 FASTQ，不默认 STARsolo。

chip:
  raw:
    - FASTQ
  conversion: null
  output: []
  velocity: false

mirna:
  raw:
    - FASTQ
  conversion: null
  output: []
  velocity: false
