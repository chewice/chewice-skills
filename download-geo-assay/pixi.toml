[workspace]
name = "download-geo-assay-skill-tests"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.12,<3.13"
pyyaml = "*"
numpy = "*"
scipy = "*"
h5py = "*"
aria2 = ">=1.37,<2"

[tasks]
test = "python scripts/self_test.py"
test-integrity = "python scripts/integrity_test.py"
test-delivery = "python scripts/delivery_test.py"
test-faults = "python scripts/fault_test.py"
compile = "python -m compileall -q scripts"
