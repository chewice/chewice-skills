[workspace]
authors = ["zdh <goodalleveryday@gmail.com>"]
channels = ["conda-forge"]
name = "research-context"
platforms = ["linux-64", "win-64"]
version = "1.0.0"

[tasks]
lint = "ruff check scripts tests"
test = "python -m unittest discover -s tests -p test_*.py"
smoke = "python tests/smoke_test.py"
validate-skill = "python tests/validate_skill.py"

[dependencies]
python = "3.12.*"
pyyaml = ">=6,<7"
ruff = ">=0.9,<1"
