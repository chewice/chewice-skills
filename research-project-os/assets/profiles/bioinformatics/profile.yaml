name: bioinformatics
description: 使用 Scientific Python/R 的 bioinformatics analysis project。
analysis_lifecycle: explore_archive_pipeline
directories:
  - archive
  - config
  - data/metadata
  - data/public
  - docs
  - explore
  - pipeline
  - reports
  - tests
required_context:
  - docs/ai_context/data_lineage.md
  - docs/ai_context/project_structure.md
  - docs/ai_context/status_policy.md
interpretation_boundary: >-
  先由 human 确认方向；explore/ 使用线性叙事 code，保留 intermediate objects
  和 diagnostics，避免过早函数化。入库 archive/ 前需人工审核。报告 inferential
  results 前，记录 biological replicate、inference unit、covariates、exclusions、
  random seed、multiple-testing family 和 dataset overlap；pipeline/ 的发布状态
  不自动证明 scientific validity。
